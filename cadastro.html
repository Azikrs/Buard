<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/cadastro.css">
    <title>Buard | Cadastro</title>
</head>
<body>
    <main>
        <div class="conteiner">
            <div class="conteiner_titulo">
                <p>Etapa 1 de 2</p>
                <h1>Crie sua conta Buard</h1>
                <p>Vamos cadastrar sua nova conta.</p>
            </div>
            
            <form class="conteiner_formulario">
                <div class="input">
                    <label for="email">Qual seu email?</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required> 
                </div>

                <div class="input">
                    <label for="senha">Crie sua senha</label>
                    <input type="password" id="senha" placeholder="Digite sua Senha" required> 
                </div>

                <div class="input">
                    <label for="senhaConf">Confirme sua senha</label>
                    <input type="password" id="senhaConf" placeholder="Digite sua Senha" required>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
